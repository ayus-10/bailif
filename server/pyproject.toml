[project]
name = "bailif-server"
version = "0.1.0"
description = ""
authors = [
    {name = "ayus-10"}
]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "pgvector>=0.5.0,<0.6.0",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.41",
    "psycopg2-binary>=2.9.12,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "pydantic-settings==2.5.2",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "boto3 (>=1.43.56,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.pyright]
include = ["app"]
exclude = ["**/__pycache__", "alembic/versions"]
typeCheckingMode = "standard"
pythonVersion = "3.14"

[dependency-groups]
dev = [
    "basedpyright (>=1.39.9,<2.0.0)",
    "ruff>=0.12.0,<1.0.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    "alembic/versions",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

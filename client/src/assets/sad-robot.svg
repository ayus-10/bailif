<svg xmlns="http://www.w3.org/2000/svg" viewBox="140 25 220 185" width="100%" height="100%">

  <!-- HEAD -->
  <g transform="rotate(6, 250, 130)">

    <!-- Antenna -->
    <path
      d="M 250,85 Q 260,55 240,35"
      fill="none"
      stroke="#9a9a9a"
      stroke-width="5"
      stroke-linecap="round"
    />

    <circle
      cx="240"
      cy="35"
      r="7"
      fill="#b8b8b8"
    />

    <!-- Head shell -->
    <rect
      x="160"
      y="65"
      width="180"
      height="135"
      rx="36"
      fill="#d6d6d6"
    />

    <!-- Screen frame -->
    <rect
      x="175"
      y="80"
      width="150"
      height="105"
      rx="24"
      fill="#5a5a5a"
    />

    <!-- Screen -->
    <rect
      x="182"
      y="87"
      width="136"
      height="91"
      rx="18"
      fill="#252525"
    />

    <!-- LEFT SAD EYE -->
    <g transform="translate(212, 118) rotate(15)">

      <ellipse
        cx="0"
        cy="0"
        rx="14"
        ry="18"
        fill="#c4c4c4"
      />

      <!-- Upper eye cover -->
      <rect
        x="-18"
        y="-21"
        width="36"
        height="23"
        rx="3"
        fill="#252525"
        transform="rotate(-10)"
      />

    </g>

    <!-- RIGHT SAD EYE -->
    <g transform="translate(288, 118) rotate(-15)">

      <ellipse
        cx="0"
        cy="0"
        rx="14"
        ry="18"
        fill="#c4c4c4"
      />

      <!-- Upper eye cover -->
      <rect
        x="-18"
        y="-21"
        width="36"
        height="23"
        rx="3"
        fill="#252525"
        transform="rotate(10)"
      />

    </g>

    <!-- SAD MOUTH -->
    <path
      d="M 232,162 Q 250,148 268,162"
      fill="none"
      stroke="#bdbdbd"
      stroke-width="4.5"
      stroke-linecap="round"
    />

  </g>
</svg>
